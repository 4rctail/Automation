<div id="ai-operator-root">
  <header>AI Browser Operator</header>
  <textarea id="ai-prompt" placeholder="Enter instruction (e.g., Click Create and wait for GMV)"></textarea>
  <div class="ai-actions">
    <button id="ai-run">Run</button>
    <button id="ai-toggle-boxes">Show Found Overlays</button>
  </div>
  <div class="ai-actions">
    <button id="ai-save-select">Save BrowserSelect.txt</button>
    <button id="ai-save-instruction">Save BrowserInstruction.txt</button>
  </div>
  <input id="ai-load-instruction" type="file" accept=".txt" />
  <pre id="ai-log"></pre>
  <div id="ai-elements"></div>
</div>
